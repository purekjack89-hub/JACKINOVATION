<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Ujian Meja Makalah - SMP Negeri 1 Nagawutung</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        .sidebar-transition { transition: all 0.3s ease-in-out; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .gradient-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .gradient-warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .gradient-info { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .gradient-dark { background: linear-gradient(135deg, #434343 0%, #000000 100%); }
        .glass-effect { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
        .table-row-hover:hover { background: linear-gradient(90deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%); }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(102,126,234,0.3); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f1f1; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #667eea; border-radius: 3px; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Login Page -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center gradient-primary p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-graduation-cap text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Sistem Penilaian</h1>
                <p class="text-gray-500 text-sm mt-1">Ujian Meja Makalah - Deep Learning</p>
                <p class="text-indigo-600 font-semibold text-sm">SMP Negeri 1 Nagawutung</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="username" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg input-focus focus:outline-none focus:border-indigo-500 transition" placeholder="Masukkan username">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg input-focus focus:outline-none focus:border-indigo-500 transition" placeholder="Masukkan password">
                    </div>
                </div>
                <button type="submit" class="w-full gradient-primary text-white py-3 rounded-lg font-semibold hover:opacity-90 transition transform hover:scale-[1.02] active:scale-[0.98]">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            <div id="loginError" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center">
                <i class="fas fa-exclamation-circle mr-1"></i> Username atau password salah!
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden min-h-screen">
        <!-- Mobile Overlay -->
        <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 gradient-primary text-white z-50 sidebar-transition transform -translate-x-full lg:translate-x-0 overflow-y-auto scrollbar-thin">
            <div class="p-5 border-b border-white/20">
                <div class="flex items-center space-x-3">
                    <div id="sidebarLogo" class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
                        <i class="fas fa-graduation-cap text-indigo-600 text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">SMP N 1 Nagawutung</h2>
                        <p class="text-xs text-white/70">Sistem Penilaian</p>
                    </div>
                </div>
            </div>
            <nav class="p-4">
                <p class="text-xs text-white/50 uppercase tracking-wider mb-3">Menu Utama</p>
                <ul class="space-y-2" id="sidebarMenu"></ul>
            </nav>
            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-white/20">
                <button onclick="logout()" class="w-full bg-white/10 hover:bg-white/20 py-2 rounded-lg transition flex items-center justify-center space-x-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="lg:ml-64 min-h-screen">
            <!-- Top Navbar -->
            <header class="glass-effect sticky top-0 z-30 px-4 py-3 shadow-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition">
                            <i class="fas fa-bars text-gray-600 text-xl"></i>
                        </button>
                        <div>
                            <h1 id="pageTitle" class="text-lg font-semibold text-gray-800">Dashboard</h1>
                            <p class="text-xs text-gray-500" id="currentDate"></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div id="syncStatusIndicator" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 text-xs cursor-pointer hover:opacity-80 transition" onclick="showSyncInfo()">
                            <span class="w-2 h-2 rounded-full bg-gray-400" id="syncDot"></span>
                            <span id="syncText">Connecting...</span>
                        </div>
                        <div class="hidden sm:block text-right">
                            <p class="text-sm font-medium text-gray-800" id="userNameDisplay"></p>
                            <p class="text-xs text-gray-500" id="userRoleDisplay"></p>
                        </div>
                        <div class="w-10 h-10 gradient-primary rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-white"></i>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="p-4 md:p-6" id="contentArea"></div>
        </main>
    </div>

    <script>
        // ==================== DATA STORE ====================
        const defaultData = {
            users: [
                { id: 1, username: 'admin', password: 'admin123', name: 'Administrator', role: 'admin' },
                { id: 2, username: 'penguji1', password: 'penguji123', name: 'Penguji 1', role: 'penguji' },
                { id: 3, username: 'penguji2', password: 'penguji123', name: 'Penguji 2', role: 'penguji' }
            ],
            students: [],
            scores: [],
            beritaAcara: [],
            settings: {
                schoolLogo: '',
                ministryLogo: '',
                principalName: '',
                principalNIP: '',
                kopDinas: 'DINAS PENDIDIKAN KABUPATEN LEMBATA\nSMP NEGERI 1 NAGAWUTUNG\nAlamat: Jl. Pendidikan No. 1, Nagawutung, Lembata, NTT'
            },
            assessmentAspects: [
                { id: 1, name: 'Kemampuan Presentasi', weight: 15, description: 'Kemampuan menyampaikan materi dengan jelas' },
                { id: 2, name: 'Penguasaan Materi', weight: 25, description: 'Pemahaman mendalam tentang topik makalah' },
                { id: 3, name: 'Kemampuan Menjawab Pertanyaan', weight: 20, description: 'Ketepatan dan kedalaman jawaban' },
                { id: 4, name: 'Kreativitas & Inovasi', weight: 15, description: 'Ide-ide baru dan pendekatan inovatif' },
                { id: 5, name: 'Ketepatan Waktu', weight: 10, description: 'Manajemen waktu presentasi' },
                { id: 6, name: 'Kerapian Makalah', weight: 15, description: 'Sistematika dan format penulisan' }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('examSystemData')) || JSON.parse(JSON.stringify(defaultData));
        
        // Ensure beritaAcara array exists for older data
        if (!appData.beritaAcara) {
            appData.beritaAcara = [];
        }
        
        let currentUser = null;

        function saveData() {
            localStorage.setItem('examSystemData', JSON.stringify(appData));
        }

        // ==================== AUTH ====================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const user = appData.users.find(u => u.username === username && u.password === password);
            
            if (user) {
                currentUser = user;
                document.getElementById('loginError').classList.add('hidden');
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initDashboard();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        function logout() {
            currentUser = null;
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // ==================== SIDEBAR ====================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function initDashboard() {
            document.getElementById('userNameDisplay').textContent = currentUser.name;
            document.getElementById('userRoleDisplay').textContent = currentUser.role === 'admin' ? 'Administrator' : 'Penguji';
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            renderSidebar();
            navigateTo('dashboard');
            updateSidebarLogo();
            
            // Auto-connect Firebase if configured
            autoConnectFirebase();
        }

        function updateSidebarLogo() {
            const logoEl = document.getElementById('sidebarLogo');
            if (appData.settings.schoolLogo) {
                logoEl.innerHTML = `<img src="${appData.settings.schoolLogo}" class="w-12 h-12 rounded-full object-cover">`;
            }
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebarMenu');
            let menuItems = [];
            
            if (currentUser.role === 'admin') {
                menuItems = [
                    { id: 'dashboard', icon: 'fas fa-tachometer-alt', label: 'Dashboard' },
                    { id: 'penguji', icon: 'fas fa-user-tie', label: 'Data Penguji' },
                    { id: 'siswa', icon: 'fas fa-users', label: 'Data Siswa' },
                    { id: 'rekap', icon: 'fas fa-chart-bar', label: 'Rekap Nilai' },
                    { id: 'beritaAcaraAdmin', icon: 'fas fa-file-signature', label: 'Berita Acara' },
                    { id: 'formManual', icon: 'fas fa-clipboard-list', label: 'Form Penilaian Manual' },
                    { id: 'backupRestore', icon: 'fas fa-database', label: 'Backup & Sinkronisasi' },
                    { id: 'pengaturan', icon: 'fas fa-cog', label: 'Pengaturan' }
                ];
            } else {
                menuItems = [
                    { id: 'dashboard', icon: 'fas fa-tachometer-alt', label: 'Dashboard' },
                    { id: 'siswa', icon: 'fas fa-users', label: 'Data Siswa' },
                    { id: 'penilaian', icon: 'fas fa-clipboard-check', label: 'Penilaian' },
                    { id: 'rekap', icon: 'fas fa-chart-bar', label: 'Rekap Nilai' },
                    { id: 'beritaAcara', icon: 'fas fa-file-signature', label: 'Berita Acara' }
                ];
            }
            
            menu.innerHTML = menuItems.map(item => `
                <li>
                    <a href="#" onclick="navigateTo('${item.id}')" class="menu-item flex items-center space-x-3 p-3 rounded-lg hover:bg-white/10 transition" data-page="${item.id}">
                        <i class="${item.icon}"></i>
                        <span>${item.label}</span>
                    </a>
                </li>
            `).join('');
        }

        function setActiveMenu(pageId) {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('bg-white/20');
                if (item.dataset.page === pageId) {
                    item.classList.add('bg-white/20');
                }
            });
        }

        // ==================== NAVIGATION ====================
        function navigateTo(page) {
            setActiveMenu(page);
            document.getElementById('pageTitle').textContent = getPageTitle(page);
            
            // Close sidebar on mobile
            if (window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }

            const content = document.getElementById('contentArea');
            content.innerHTML = '<div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-indigo-600"></i></div>';
            
            setTimeout(() => {
                switch(page) {
                    case 'dashboard': renderDashboard(); break;
                    case 'penguji': renderPenguji(); break;
                    case 'siswa': renderSiswa(); break;
                    case 'penilaian': renderPenilaian(); break;
                    case 'rekap': renderRekap(); break;
                    case 'beritaAcara': renderBeritaAcara(); break;
                    case 'beritaAcaraAdmin': renderBeritaAcaraAdmin(); break;
                    case 'formManual': renderFormManual(); break;
                    case 'backupRestore': renderBackupRestore(); break;
                    case 'pengaturan': renderPengaturan(); break;
                }
            }, 200);
        }

        function getPageTitle(page) {
            const titles = {
                dashboard: 'Dashboard',
                penguji: 'Data Penguji',
                siswa: 'Data Siswa',
                penilaian: 'Penilaian Ujian',
                rekap: 'Rekap Nilai',
                beritaAcara: 'Berita Acara',
                beritaAcaraAdmin: 'Berita Acara',
                formManual: 'Form Penilaian Manual',
                backupRestore: 'Backup & Sinkronisasi',
                pengaturan: 'Pengaturan'
            };
            return titles[page] || 'Dashboard';
        }

        // ==================== DASHBOARD PAGE ====================
        function renderDashboard() {
            const totalStudents = appData.students.length;
            const totalExaminers = appData.users.filter(u => u.role === 'penguji').length;
            const totalScored = [...new Set(appData.scores.map(s => s.studentId))].length;
            const avgScore = appData.scores.length > 0 
                ? (appData.scores.reduce((a, b) => a + b.totalScore, 0) / appData.scores.length).toFixed(1)
                : 0;
            const totalBeritaAcara = appData.beritaAcara ? appData.beritaAcara.length : 0;

            document.getElementById('contentArea').innerHTML = `
                <div class="animate-fade-in">
                    <!-- Stats Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
                        <div class="gradient-primary rounded-xl p-5 text-white card-hover transition-all duration-300">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white/70 text-sm">Total Siswa</p>
                                    <h3 class="text-3xl font-bold">${totalStudents}</h3>
                                </div>
                                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-users text-2xl"></i>
                                </div>
                            </div>
                        </div>
                        <div class="gradient-success rounded-xl p-5 text-white card-hover transition-all duration-300">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white/70 text-sm">Penguji</p>
                                    <h3 class="text-3xl font-bold">${totalExaminers}</h3>
                                </div>
                                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-user-tie text-2xl"></i>
                                </div>
                            </div>
                        </div>
                        <div class="gradient-warning rounded-xl p-5 text-white card-hover transition-all duration-300">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white/70 text-sm">Sudah Dinilai</p>
                                    <h3 class="text-3xl font-bold">${totalScored}</h3>
                                </div>
                                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-check-circle text-2xl"></i>
                                </div>
                            </div>
                        </div>
                        <div class="gradient-info rounded-xl p-5 text-white card-hover transition-all duration-300">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white/70 text-sm">Rata-rata Nilai</p>
                                    <h3 class="text-3xl font-bold">${avgScore}</h3>
                                </div>
                                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-chart-line text-2xl"></i>
                                </div>
                            </div>
                        </div>
                        <div class="gradient-dark rounded-xl p-5 text-white card-hover transition-all duration-300">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white/70 text-sm">Berita Acara</p>
                                    <h3 class="text-3xl font-bold">${totalBeritaAcara}</h3>
                                </div>
                                <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center">
                                    <i class="fas fa-file-signature text-2xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Aspek Penilaian -->
                    <div class="bg-white rounded-xl shadow-lg p-5 mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-clipboard-list text-indigo-600 mr-2"></i>
                            Aspek Penilaian Ujian Meja Makalah (Kurikulum Deep Learning)
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${appData.assessmentAspects.map(aspect => `
                                <div class="border border-gray-200 rounded-lg p-4 hover:border-indigo-300 transition">
                                    <div class="flex items-center justify-between mb-2">
                                        <h4 class="font-medium text-gray-800">${aspect.name}</h4>
                                        <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-medium">${aspect.weight}%</span>
                                    </div>
                                    <p class="text-gray-500 text-sm">${aspect.description}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recent Scores -->
                    <div class="bg-white rounded-xl shadow-lg p-5">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-history text-indigo-600 mr-2"></i>
                            Penilaian Terbaru
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead>
                                    <tr class="border-b border-gray-200">
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Siswa</th>
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Penguji</th>
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Total Nilai</th>
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Tanggal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${appData.scores.slice(-5).reverse().map(score => {
                                        const student = appData.students.find(s => s.id === score.studentId);
                                        const examiner = appData.users.find(u => u.id === score.examinerId);
                                        return `
                                            <tr class="border-b border-gray-100 table-row-hover">
                                                <td class="py-3 px-4 text-sm">${student?.name || '-'}</td>
                                                <td class="py-3 px-4 text-sm">${examiner?.name || '-'}</td>
                                                <td class="py-3 px-4">
                                                    <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-sm font-medium">${score.totalScore.toFixed(1)}</span>
                                                </td>
                                                <td class="py-3 px-4 text-sm text-gray-500">${new Date(score.date).toLocaleDateString('id-ID')}</td>
                                            </tr>
                                        `;
                                    }).join('') || '<tr><td colspan="4" class="text-center py-8 text-gray-400">Belum ada penilaian</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== PENGUJI PAGE ====================
        function renderPenguji() {
            const examiners = appData.users.filter(u => u.role === 'penguji');
            
            document.getElementById('contentArea').innerHTML = `
                <div class="animate-fade-in">
                    <div class="bg-white rounded-xl shadow-lg p-5 mb-6">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                            <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                                <i class="fas fa-user-tie text-indigo-600 mr-2"></i>
                                Daftar Penguji
                            </h3>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="showAddPengujiModal()" class="gradient-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition flex items-center">
                                    <i class="fas fa-plus mr-2"></i>Tambah Penguji
                                </button>
                                <label class="gradient-success text-white px-4 py-2 rounded-lg text-sm font-medium hover:opacity-90 transition flex items-center cursor-pointer">
                                    <i class="fas fa-file-excel mr-2"></i>Import Excel
                                    <input type="file" accept=".xlsx,.xls" onchange="importPengujiExcel(event)" class="hidden">
                                </label>
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead>
                                    <tr class="border-b border-gray-200 bg-gray-50">
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">No</th>
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Nama</th>
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Username</th>
                                        <th class="text-left py-3 px-4 text-sm font-semibold text-gray-600">Password</th>

        function loadStudentForScoring() {
            const studentId = parseInt(document.getElementById('selectStudent').value);
            const scoringForm = document.getElementById('scoringForm');
            
            if (studentId) {
                const student = appData.students.find(s => s.id === studentId);
                document.getElementById('selectedStudentName').textContent = student.name;
                document.getElementById('selectedStudentInfo').textContent = `NIS: ${student.nis} | Kelas: ${student.kelas} | Judul: ${student.judulMakalah || '-'}`;
                scoringForm.classList.remove('hidden');
                
                // Check if already scored
                const existingScore = appData.scores.find(s => s.studentId === studentId && s.examinerId === currentUser.id);
                if (existingScore) {
                    appData.assessmentAspects.forEach(aspect => {
                        const scoreInput = document.getElementById(`score_${aspect.id}`);
                        if (scoreInput && existingScore.details) {
                            const detail = existingScore.details.find(d => d.aspectId === aspect.id);
                            if (detail) scoreInput.value = detail.score;
                        }
                    });
                }
            } else {
                scoringForm.classList.add('hidden');
            }
        }

        function submitScore(e) {
            e.preventDefault();
            const studentId = parseInt(document.getElementById('selectStudent').value);
            
            let details = [];
            let totalWeightedScore = 0;
            
            appData.assessmentAspects.forEach(aspect => {
                const score = parseInt(document.getElementById(`score_${aspect.id}`).value);
                details.push({ aspectId: aspect.id, score: score });
                totalWeightedScore += (score * aspect.weight / 100);
            });

            // Remove existing score if any
            appData.scores = appData.scores.filter(s => !(s.studentId === studentId && s.examinerId === currentUser.id));
            
            appData.scores.push({
                id: Date.now(),
                studentId: studentId,
                examinerId: currentUser.id,
                details: details,
                totalScore: totalWeightedScore,
                date: new Date().toISOString()
            });

            saveData();
            showToast('Penilaian berhasil disimpan!');
            document.getElementById('selectStudent').value = '';
            document.getElementById('scoringForm').classList.add('hidden');
        }

        function resetForm() {
            appData.assessmentAspects.forEach(aspect => {
                document.getElementById(`score_${aspect.id}`).value = '';
            });
        }

        function generateBeritaAcaraPDF(ba) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pageWidth = doc.internal.pageSize.width;
            
            // Header
            addPDFHeader(doc);
            
            // Title
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text('BERITA ACARA', pageWidth / 2, 50, { align: 'center' });
            doc.text('PELAKSANAAN UJIAN MEJA MAKALAH', pageWidth / 2, 57, { align: 'center' });
            doc.text('BERBASIS KURIKULUM DEEP LEARNING', pageWidth / 2, 64, { align: 'center' });
            
            doc.setFontSize(11);
            doc.text(`Nomor: ${ba.number}`, pageWidth / 2, 74, { align: 'center' });
            
            // Content
            doc.setFontSize(11);
            doc.setFont(undefined, 'normal');
            
            let y = 90;
            const leftMargin = 20;
            const lineHeight = 7;
            
            const dateFormatted = new Date(ba.date).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
            doc.text('Pada hari ini, ' + dateFormatted + ', telah dilaksanakan Ujian Meja Makalah', leftMargin, y);
            y += lineHeight;
            doc.text('Berbasis Kurikulum Deep Learning dengan keterangan sebagai berikut:', leftMargin, y);
            y += lineHeight * 2;
            
            // Details table
            const details = [
                ['Hari/Tanggal', dateFormatted],
                ['Waktu', `${ba.timeStart} - ${ba.timeEnd} WITA`],
                ['Tempat', ba.place],
                ['Jumlah Peserta', `${ba.participants} siswa`]
            ];
            
            details.forEach(([label, value]) => {
                doc.setFont(undefined, 'bold');
                doc.text(label, leftMargin, y);
                doc.setFont(undefined, 'normal');
                doc.text(': ' + value, leftMargin + 45, y);
                y += lineHeight;
            });
            
            y += lineHeight;
            
            // Notes
            doc.setFont(undefined, 'bold');
            doc.text('Catatan Pelaksanaan:', leftMargin, y);
            y += lineHeight;
            doc.setFont(undefined, 'normal');
            const notesLines = doc.splitTextToSize(ba.notes || 'Tidak ada catatan khusus.', pageWidth - 40);
            doc.text(notesLines, leftMargin, y);
            y += notesLines.length * lineHeight + lineHeight;
            
            // Problems
            doc.setFont(undefined, 'bold');
            doc.text('Kendala/Permasalahan:', leftMargin, y);
            y += lineHeight;
            doc.setFont(undefined, 'normal');
            const problemsLines = doc.splitTextToSize(ba.problems || 'Tidak ada kendala.', pageWidth - 40);
            doc.text(problemsLines, leftMargin, y);
            y += problemsLines.length * lineHeight + lineHeight;
            
            // Closing
            doc.text('Demikian berita acara ini dibuat dengan sebenarnya untuk dapat dipergunakan', leftMargin, y);
            y += lineHeight;
            doc.text('sebagaimana mestinya.', leftMargin, y);
            
            // Signatures
            addBeritaAcaraSignatures(doc);
            
            doc.save(`Berita_Acara_${ba.number.replace(/\//g, '-')}.pdf`);
        }

        function addBeritaAcaraSignatures(doc) {
            const pageWidth = doc.internal.pageSize.width;
            const pageHeight = doc.internal.pageSize.height;
            const y = pageHeight - 70;
            
            const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            
            // Examiners
            const examiners = appData.users.filter(u => u.role === 'penguji');
            
            doc.text('Penguji 1,', 25, y);
            doc.text('Penguji 2,', 75, y);
            
            doc.text(examiners[0]?.name || '________________', 25, y + 30);
            doc.text(examiners[1]?.name || '________________', 75, y + 30);
            
            // Principal
            doc.text(`Nagawutung, ${today}`, pageWidth - 75, y - 10);
            doc.text('Mengetahui,', pageWidth - 75, y);
            doc.text('Kepala Sekolah', pageWidth - 75, y + 6);
            doc.text(appData.settings.principalName || '________________', pageWidth - 75, y + 30);
            if (appData.settings.principalNIP) {
                doc.setFontSize(9);
                doc.text(`NIP. ${appData.settings.principalNIP}`, pageWidth - 75, y + 35);

        }

        // Export data to JSON file
        function exportDataToJSON() {
            const dataToExport = {
                version: '1.0',
                exportDate: new Date().toISOString(),
                schoolName: 'SMP Negeri 1 Nagawutung',
                data: appData
            };
            
            const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_ujian_meja_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            localStorage.setItem('lastBackupDate', new Date().toLocaleString('id-ID'));
            showToast('Data berhasil di-export! Simpan file dengan aman.');
            renderBackupRestore();
        }

        // Import data from JSON file
        function importDataFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    if (imported.data && imported.data.users) {
                        if (confirm(`Anda akan mengimport data dari backup tanggal ${new Date(imported.exportDate).toLocaleString('id-ID')}.\n\nData saat ini akan ditimpa. Lanjutkan?`)) {
                            appData = imported.data;
                            
                            // Ensure all arrays exist
                            if (!appData.beritaAcara) appData.beritaAcara = [];
                            if (!appData.scores) appData.scores = [];
                            if (!appData.students) appData.students = [];
                            if (!appData.settings) appData.settings = defaultData.settings;
                            
                            saveData();
                            showToast('Data berhasil di-import!');
                            renderBackupRestore();
                            updateSidebarLogo();
                        }
                    } else {

        // Connect to Firebase
        function connectFirebase() {
            const configText = document.getElementById('firebaseConfigInput').value.trim();
            
            if (!configText) {
                showToast('Masukkan konfigurasi Firebase!', 'warning');
                return;
            }
            
            try {
                const config = JSON.parse(configText);
                
                if (!config.databaseURL) {
                    // Try to construct databaseURL from projectId
                    if (config.projectId) {
                        config.databaseURL = `https://${config.projectId}-default-rtdb.firebaseio.com`;
                    } else {
                        showToast('databaseURL tidak ditemukan dalam konfigurasi!', 'error');
                        return;
                    }
                }
                
                // Initialize Firebase
                if (firebase.apps.length) {
                    // Delete existing app and reinitialize
                    firebase.app().delete().then(() => {
                        firebase.initializeApp(config);
                        testFirebaseConnection(config);
                    });
                } else {
                    firebase.initializeApp(config);
                    testFirebaseConnection(config);
                }
                
            } catch (err) {
                showToast('Konfigurasi JSON tidak valid! ' + err.message, 'error');
            }
        }
        
        function testFirebaseConnection(config) {
            const testRef = firebase.database().ref('.info/connected');
            testRef.on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    firebaseConnected = true;
                    firebaseConfig = config;
                    localStorage.setItem('firebaseConfig', JSON.stringify(config));
                    localStorage.setItem('autoSync', 'true');
                    showToast('🎉 Berhasil terhubung ke Firebase! Auto Sync diaktifkan.');
                    updateSyncStatus();
                    renderBackupRestore();
                    enableRealtimeSync();
                    
                    // Immediately sync data to cloud
                    syncToFirebase();
                } else {
                    firebaseConnected = false;
                    updateSyncStatus();
                }
            });
        }

        // Sync data to Firebase
        function syncToFirebase() {
            if (!firebaseConnected) {
                showToast('Firebase tidak terhubung!', 'error');
                return;
            }
            
            const dataToSync = {
                ...appData,
                lastUpdated: new Date().toISOString(),
                updatedBy: currentUser ? currentUser.name : 'System'
            };
            
            firebase.database().ref('ujianMeja').set(dataToSync)
                .then(() => {
                    localStorage.setItem('lastSyncDate', new Date().toLocaleString('id-ID'));
                    showToast('✅ Data berhasil diupload ke cloud!');
                    if (document.getElementById('contentArea').innerHTML.includes('Backup')) {
                        renderBackupRestore();
                    }
                })
                .catch((error) => {
                    if (error.message.includes('Permission denied')) {
                        showToast('❌ Akses ditolak! Pastikan rules Firebase sudah diatur dengan benar.', 'error');
                        showFirebaseRulesHelp();
                    } else {
                        showToast('Gagal upload: ' + error.message, 'error');
                    }
                });
        }

        // Sync data from Firebase
        function syncFromFirebase() {
            if (!firebaseConnected) {
                showToast('Firebase tidak terhubung!', 'error');
                return;
            }
            
            firebase.database().ref('ujianMeja').once('value')
                .then((snapshot) => {
                    const cloudData = snapshot.val();
                    if (cloudData) {
                        if (confirm(`Data cloud terakhir diupdate: ${new Date(cloudData.lastUpdated).toLocaleString('id-ID')} oleh ${cloudData.updatedBy}.\n\nDownload dan timpa data lokal?`)) {
                            appData = cloudData;
                            if (!appData.beritaAcara) appData.beritaAcara = [];
                            saveData();
                            localStorage.setItem('lastSyncDate', new Date().toLocaleString('id-ID'));
                            showToast('Data berhasil didownload dari cloud!');
                            renderBackupRestore();
                            updateSidebarLogo();
                        }
                    } else {
                        showToast('Tidak ada data di cloud.', 'warning');
                    }
                })
                .catch((error) => {

                });

        // Enable auto sync
        function enableAutoSync() {
            const currentState = localStorage.getItem('autoSync') === 'true';
            localStorage.setItem('autoSync', (!currentState).toString());
            
            if (!currentState) {
                enableRealtimeSync();
                showToast('Auto Sync diaktifkan! Data akan otomatis tersinkronisasi.');
            } else {
                showToast('Auto Sync dinonaktifkan.', 'warning');
            }
            
            renderBackupRestore();
        }

        // Enable realtime sync
        function enableRealtimeSync() {
            if (!firebaseConnected) return;
            
            // Listen for changes from cloud
            firebase.database().ref('ujianMeja').on('value', (snapshot) => {
                const cloudData = snapshot.val();
                if (cloudData && cloudData.lastUpdated) {
                    const localLastUpdated = appData.lastUpdated || '';
                    if (cloudData.lastUpdated > localLastUpdated && cloudData.updatedBy !== currentUser.name) {
                        appData = cloudData;
                        if (!appData.beritaAcara) appData.beritaAcara = [];
                        saveData();
                        showToast('Data diperbarui dari cloud (oleh ' + cloudData.updatedBy + ')');
                    }
                }
            });
        }

        // Auto-connect Firebase on load
        function autoConnectFirebase() {
            const config = firebaseConfig || defaultFirebaseConfig;
            
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(config);
                }
                
                firebase.database().ref('.info/connected').on('value', (snapshot) => {
                    if (snapshot.val() === true) {
                        firebaseConnected = true;
                        firebaseConfig = config;
                        localStorage.setItem('firebaseConfig', JSON.stringify(config));
                        
                        // Always enable auto sync when Firebase is connected
                        localStorage.setItem('autoSync', 'true');
                        
                        updateSyncStatus();
                        enableRealtimeSync();
                        
                        // Auto sync from cloud on first load
                        autoSyncFromCloud();
                        
                        console.log('✅ Firebase connected successfully!');
                    } else {
                        firebaseConnected = false;
                        updateSyncStatus();
                    }
                });
            } catch (err) {
                console.log('Firebase auto-connect failed:', err);
                firebaseConnected = false;
                updateSyncStatus();
            }
        }
        
        // Auto sync from cloud on startup
        function autoSyncFromCloud() {
            if (!firebaseConnected) return;
            
            firebase.database().ref('ujianMeja').once('value')
                .then((snapshot) => {
                    const cloudData = snapshot.val();
                    if (cloudData && cloudData.lastUpdated) {
                        const localLastUpdated = appData.lastUpdated || '';
                        
                        // If cloud has newer data, use it
                        if (cloudData.lastUpdated > localLastUpdated) {
                            appData = cloudData;
                            if (!appData.beritaAcara) appData.beritaAcara = [];
                            localStorage.setItem('examSystemData', JSON.stringify(appData));
                            console.log('📥 Data synced from cloud');
                        }
                    } else if (!cloudData && appData.students.length > 0) {
                        // If cloud is empty but local has data, upload to cloud
                        syncToFirebase();
                        console.log('📤 Local data uploaded to cloud');
                    }
                })
                .catch((error) => {
                    console.log('Auto sync failed:', error);
                });
        }

        // ==================== PDF GENERATION ====================
        function printRekapPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            addPDFHeader(doc);
            
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text('REKAP NILAI UJIAN MEJA MAKALAH', doc.internal.pageSize.width / 2, 55, { align: 'center' });
            doc.text('BERBASIS KURIKULUM DEEP LEARNING', doc.internal.pageSize.width / 2, 62, { align: 'center' });
            
            // Table
            const examiners = appData.users.filter(u => u.role === 'penguji');
            const headers = [['No', 'NIS', 'Nama Siswa', 'Kelas', ...examiners.map(e => e.name), 'Rata-rata']];
            
            const data = appData.students.map((student, i) => {
                const scores = examiners.map(ex => {
                    const score = appData.scores.find(s => s.studentId === student.id && s.examinerId === ex.id);
                    return score ? score.totalScore.toFixed(1) : '-';
                });
                const validScores = appData.scores.filter(s => s.studentId === student.id);
                const avg = validScores.length > 0 
                    ? (validScores.reduce((a, b) => a + b.totalScore, 0) / validScores.length).toFixed(1) 
                    : '-';
                return [i + 1, student.nis, student.name, student.kelas, ...scores, avg];
            });

            doc.autoTable({
                head: headers,
                body: data,
                startY: 70,
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [102, 126, 234] }
            });

            // Signatures
            addPDFSignatures(doc);
            
            doc.save('Rekap_Nilai_Ujian_Meja.pdf');
        }

        function printStudentPDF(studentId) {
            const student = appData.students.find(s => s.id === studentId);
            const studentScores = appData.scores.filter(s => s.studentId === studentId);
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            addPDFHeader(doc);
            
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text('LEMBAR PENILAIAN UJIAN MEJA MAKALAH', doc.internal.pageSize.width / 2, 55, { align: 'center' });
            
            // Student Info
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            doc.text(`Nama Siswa: ${student.name}`, 20, 70);
            doc.text(`NIS: ${student.nis}`, 20, 77);
            doc.text(`Kelas: ${student.kelas}`, 20, 84);
            doc.text(`Judul Makalah: ${student.judulMakalah || '-'}`, 20, 91);
            
            // Scores Table
            const headers = [['No', 'Aspek Penilaian', 'Bobot', ...appData.users.filter(u => u.role === 'penguji').map(p => p.name)]];
            
            const data = appData.assessmentAspects.map((aspect, i) => {
                const scores = appData.users.filter(u => u.role === 'penguji').map(ex => {
                    const scoreRecord = studentScores.find(s => s.examinerId === ex.id);
                    if (scoreRecord && scoreRecord.details) {
                        const detail = scoreRecord.details.find(d => d.aspectId === aspect.id);
                        return detail ? detail.score : '-';
                    }
                    return '-';
                });
                return [i + 1, aspect.name, aspect.weight + '%', ...scores];
            });

            // Add total row
            const totals = appData.users.filter(u => u.role === 'penguji').map(ex => {
                const score = studentScores.find(s => s.examinerId === ex.id);
                return score ? score.totalScore.toFixed(1) : '-';
            });
            data.push(['', 'TOTAL NILAI', '100%', ...totals]);

            doc.autoTable({
                head: headers,
                body: data,
                startY: 100,
                styles: { fontSize: 9, cellPadding: 3 },
                headStyles: { fillColor: [102, 126, 234] }
            });

            // Average
            const avgScore = studentScores.length > 0 
                ? (studentScores.reduce((a, b) => a + b.totalScore, 0) / studentScores.length).toFixed(1)
                : '-';
            
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(12);
            doc.setFont(undefined, 'bold');
            doc.text(`NILAI RATA-RATA: ${avgScore}`, 20, finalY);

            // Signatures
            addPDFSignatures(doc);
            
            doc.save(`Nilai_${student.name.replace(/\s+/g, '_')}.pdf`);
        }

            doc.setFontSize(12);
            doc.setFont(undefined, 'bold');
            const kopLines = appData.settings.kopDinas.split('\n');
            let y = 12;
            kopLines.forEach(line => {
                doc.text(line, pageWidth / 2, y, { align: 'center' });
                y += 6;
            });
            
            // Lines
            doc.setLineWidth(0.5);
            doc.line(20, 35, pageWidth - 20, 35);
            doc.setLineWidth(0.2);
            doc.line(20, 37, pageWidth - 20, 37);
        }

        function addPDFSignatures(doc) {
            const pageWidth = doc.internal.pageSize.width;
            const pageHeight = doc.internal.pageSize.height;
            const y = pageHeight - 60;
            
            const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            
            // Examiners
            const examiners = appData.users.filter(u => u.role === 'penguji');
            
            if (examiners.length > 0) {
                doc.text('Penguji 1,', 30, y);
                doc.text(examiners[0]?.name || '________________', 30, y + 25);
            }
            
            if (examiners.length > 1) {
                doc.text('Penguji 2,', 80, y);
                doc.text(examiners[1]?.name || '________________', 80, y + 25);
            }
            
            // Principal
            doc.text(`Nagawutung, ${today}`, pageWidth - 70, y - 10);
            doc.text('Mengetahui,', pageWidth - 70, y);
            doc.text('Kepala Sekolah', pageWidth - 70, y + 6);
            doc.text(appData.settings.principalName || '________________', pageWidth - 70, y + 25);
            if (appData.settings.principalNIP) {
                doc.text(`NIP. ${appData.settings.principalNIP}`, pageWidth - 70, y + 30);
            }
        }

        // ==================== MODAL ====================
        function showModal(title, content) {
            const modal = document.createElement('div');
            modal.id = 'modal';
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-md animate-fade-in max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between p-4 border-b">
                        <h3 class="text-lg font-semibold text-gray-800">${title}</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    <div class="p-5">${content}</div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            if (modal) modal.remove();
        }

        // ==================== TOAST ====================
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg text-white shadow-lg z-50 animate-fade-in ${type === 'success' ? 'bg-green-500' : type === 'warning' ? 'bg-yellow-500' : 'bg-red-500'}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== INIT ====================
        // Check if there's a logged in session
        window.addEventListener('load', () => {
            // Initialize Firebase on page load
            initFirebaseOnLoad();
        });
        
        function initFirebaseOnLoad() {
            const config = firebaseConfig || defaultFirebaseConfig;
            
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(config);
                    console.log('🔥 Firebase initialized');
                }
            } catch (err) {
                console.log('Firebase init error:', err);
            }
        }
    </script>
</body>
</html>
